[workspace]
resolver = "3"
members = ["crates/kiln-proto", "crates/kiln-data", "crates/kiln-server", "xtask"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
kiln-proto = { path = "crates/kiln-proto" }
kiln-data = { path = "crates/kiln-data" }
anyhow = "1"
bytes = "1"
crossbeam-channel = "0.5"
libdeflater = "1"
md-5 = "0.10"
mimalloc = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = "1"

[profile.release]
debug = "line-tables-only"

[profile.profiling]
inherits = "release"
debug = true
