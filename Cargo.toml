[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
kiln-proto = { path = "crates/kiln-proto" }
kiln-data = { path = "crates/kiln-data" }
kiln-link = { path = "crates/kiln-link" }
kiln-net = { path = "crates/kiln-net" }
kiln-sim = { path = "crates/kiln-sim" }
kiln-world = { path = "crates/kiln-world" }
anyhow = "1"
bytes = "1"
crossbeam-channel = "0.5"
flate2 = "1"
libdeflater = "1"
md-5 = "0.10"
mimalloc = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
thiserror = "2"
toml = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = "3"
uuid = "1"

[profile.release]
debug = "line-tables-only"

[profile.profiling]
inherits = "release"
debug = true
