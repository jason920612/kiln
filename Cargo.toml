[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
kiln-proto = { path = "crates/kiln-proto" }
kiln-data = { path = "crates/kiln-data" }
kiln-blocks = { path = "crates/kiln-blocks" }
kiln-entity = { path = "crates/kiln-entity" }
kiln-item = { path = "crates/kiln-item" }
kiln-inventory = { path = "crates/kiln-inventory" }
kiln-loot = { path = "crates/kiln-loot" }
kiln-link = { path = "crates/kiln-link" }
kiln-net = { path = "crates/kiln-net" }
kiln-sim = { path = "crates/kiln-sim" }
kiln-world = { path = "crates/kiln-world" }
kiln-storage = { path = "crates/kiln-storage" }
aes = "0.9"
kiln-command = { path = "crates/kiln-command" }
kiln-region = { path = "crates/kiln-region" }
kiln-sched = { path = "crates/kiln-sched" }
kiln-javamath = { path = "crates/kiln-javamath" }
kiln-worldgen = { path = "crates/kiln-worldgen" }
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
cfb8 = "0.9"
crossbeam-channel = "0.5"
crossbeam-deque = "0.8"
crossbeam-utils = "0.8"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-decode", "safe-encode"] }
hmac = "0.12"
libdeflater = "1"
loom = "0.7"
md-5 = "0.10"
mimalloc = "0.1"
proptest = { version = "1", default-features = false, features = ["std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rsa = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
smallvec = "1"
subtle = "2"
thiserror = "2"
toml = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
uuid = "1"

[profile.release]
debug = "line-tables-only"

[profile.profiling]
inherits = "release"
debug = true

# Keep tests and dev builds usable: dependencies (compression, hashing) are slow unoptimized.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
