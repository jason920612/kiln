id = "homes"
version = "0.1.0"
api = "1"
capabilities = ["command.register", "player.message", "scheduler", "player.control"]

# Taking damage disarms a pending /home. The config key `warmup` (ticks the player must stand
# still after /home, default 60) is optional.
[[subscribe]]
event = "player-damage"
policy = "fail-open"
