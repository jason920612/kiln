# A plugin built against the frozen kiln:api 1.0.0 WIT (wit/kiln-api.wit here is the file as of
# the 1.0 freeze, `git show c1b432fb:wit/kiln-api.wit`), without the SDK (which is 1.1). The
# built `compat10.wasm` is checked in: the host test `api_compat.rs` loads it on the current
# host. Rebuild with `./build.sh` (needs the wasm32-wasip2 target).
[workspace]

[package]
name = "compat10"
edition = "2024"
version = "0.1.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.62"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
