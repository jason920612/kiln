[package]
name = "kiln-plugin-host"
description = "WASM plugin host (design §11): wasmtime component model, WIT package kiln:api"
edition.workspace = true
version.workspace = true
publish.workspace = true

[features]
default = ["async-tasks"]
# The `async-tasks` world (WASI 0.3 component-model async): HTTP, timers and storage for a
# plugin's second component. Off, the build leaves out wasmtime's component-model async, tokio
# and ureq, and plugins that ship a tasks component are not loaded (no measurable difference
# on the call path: a trivial handler costs 110 ns with it and 109 ns without).
async-tasks = ["wasmtime/component-model-async", "dep:tokio", "dep:ureq", "dep:futures"]

[dependencies]
wasmtime.workspace = true
wasmtime-wasi.workspace = true
anyhow.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
uuid.workspace = true
tokio = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
tracing-subscriber.workspace = true
sha2.workspace = true
