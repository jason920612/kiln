[package]
name = "kiln-entity"
description = "Vanilla 26.3 entity movement physics and non-mob entity behaviour, independent of the simulation"
edition.workspace = true
version.workspace = true
publish.workspace = true

[features]
# Cost counters per named scope (`prof!`), printed by sim_load.
prof = []

[dependencies]
bytes.workspace = true
kiln-command.workspace = true
kiln-data.workspace = true
kiln-inventory.workspace = true
kiln-item.workspace = true
kiln-javamath.workspace = true
kiln-loot.workspace = true
kiln-proto.workspace = true
smallvec.workspace = true
uuid.workspace = true

[dev-dependencies]
serde_json = { workspace = true, features = ["float_roundtrip"] }
