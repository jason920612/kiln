# Protocol completeness list, checked by `cargo xtask completeness` against the generated
# packets.json: every packet must be listed, and every listed packet must still exist.
#
#   implemented  encoded or decoded by Kiln (the note says how much of it)
#   ignored      received and deliberately dropped, with a test that proves it is harmless
#   deferred     not implemented yet; the note names the feature it belongs to
#
# Serverbound packets that are not implemented are currently read and dropped
# (kiln-proto `decode_play`, kiln-net `configure`). Keys are packet names without the
# `minecraft:` namespace, in protocol id order.

[handshake.serverbound]
intention = { status = "implemented", note = "kiln-net handle(); host and port are read and ignored" }

[status.clientbound]
status_response = { status = "implemented", note = "packets::status_response: version, player counts, MOTD" }
pong_response = { status = "implemented", note = "packets::status_pong" }

[status.serverbound]
status_request = { status = "implemented", note = "kiln-net status()" }
ping_request = { status = "implemented", note = "kiln-net status(); answered, then the connection ends" }

[login.clientbound]
login_disconnect = { status = "implemented", note = "packets::login_disconnect: wrong protocol, invalid name, server full" }
hello = { status = "implemented", note = "packets::login_ext encryption_request: online mode (RSA-1024, AES-CFB8)" }
login_finished = { status = "implemented", note = "packets::login_finished with profile properties (online mode / proxy forwarding)" }
login_compression = { status = "implemented", note = "packets::login_compression when a threshold is configured" }
custom_query = { status = "implemented", note = "packets::login_ext custom_query: Velocity modern forwarding request" }
cookie_request = { status = "deferred", note = "cookies (transfers)" }

[login.serverbound]
